pos quirúrgicos, insumos|Agenda, Esterilización, Inventario, Patología|Tiempos (incisión, cierre) para indicadores; consumo de insumos asociado al paciente.","SNOMED CT; NANDA/NIC/NOC; FHIR MedicationAdministration|Plan de cuidados, signos vitales, balance, administración|Farmacia, Órdenes, Clínico, monitores|Administración segura (pulsera y código de barras); integrar monitores y bombas exige HL7 o IEEE 11073.","CPOE; HL7 ORM/OML; FHIR ServiceRequest; LOINC|Orden, prioridad, estado, indicación clínica|Laboratorio, Imagen, Farmacia, Nutrición|Catálogo de prestaciones codificado y mapeado (LOINC o código local); un mapeo errado rompe los resultados.","FHIR ServiceRequest/Task; HL7 REF|Especialidad destino, motivo, prioridad, respuesta|Clínico, Agenda, SIGTE|Flujo de estados y plazos; notificar al solicitante cuando hay respuesta.","CIF (OMS); FHIR CarePlan|Plan, sesiones, evaluación funcional|Agenda, Clínico|Escalas funcionales estructuradas permiten medir la evolución.","FHIR; HL7; WebRTC; Ley 19.628 y 20.584|Sesión, consentimiento, registro clínico, receta electrónica|Agenda, Portal, Clínico, Receta|Seguridad de la transmisión, identidad del paciente, consentimiento y disponibilidad de la plataforma.","REM; enfermedades de notificación obligatoria; CIE-10|Casos notificables, datos agregados REM|Clínico, Laboratorio, MINSAL/DEIS|Reglas que detecten casos de notificación obligatoria; consistencia de los REM.","ATC; HL7 RDE/RDS; FHIR MedicationRequest|Producto, lote, vencimiento, dosis, vía, stock|Órdenes, Enfermería, Inventario|Catálogo de fármacos único y mapeado a ATC; alertas de interacción y alergia.","LOINC; HL7 ORU/OML; interfaz con analizadores; FHIR DiagnosticReport/Observation|Orden, muestra, analito, resultado, unidad, rango, estado|Órdenes, Clínico, analizadores, middleware|Mapeo de analitos a LOINC, unidades y valores críticos; interfaces bidireccionales con equipos.","DICOM; DICOMweb; HL7 ORM/ORU; FHIR ImagingStudy; IHE SWF|Estudio, serie, imagen, inform D.forEach((d,i)=>{if(d[1]!==ci)return;const q=pos[i],px=L?210:790,py=q.y+11,m=(sx+px)/2;

C.forEach((c,ci)=>{const p=cpos[ci];s+=`<g class="cat" data-c="${ci}" style="--a:var(--${c[1]})" transform="translate(${p.s?590:290},${p.y-17})"><rect width="120" height="34" rx="10"/><text x="60" y="21">${c[0]}</text></g>`});
D.forEach((d,i)=>{const q=pos[i];s+=`<g class="pill" data-i="${i}" style="--a:var(--${C[d[1]][1]})" transform="translate(${q.x},${q.y})"><rect width="190" height="22" rx="11"/><text x="95" y="15">${d[0]}</text></g>`});
s+=`<g class="hub"><circle cx="500" cy="${hy}" r="48"/><text x="500" y="${hy+4}" font-size="26" font-weight="800">HIS</text><text x="500" y="${hy+24}" font-size="10">módulos</text></g>`;
$("svg").innerHTML=s;dim()}
function dim(){const t=$("q").value.toLowerCase();
document.querySelectorAll("[data-i]").forEach(e=>{const d=D[+e.dataset.i];e.classList.toggle("off",!((cat<0||d[1]===cat)&&(d[0]+d[2]+d[3]).toLowerCase().includes(t)))});
document.querySelectorAll("[data-c]").forEach(e=>e.classList.toggle("off",cat>=0&&+e.dataset.c!==cat))}
function chips(){$("chips").innerHTML=[["Todos",-1,"var(--tx)"],...C.map((c,i)=>[c[0],i,`var(--${c[1]})`])].map(([n,i,col])=>`<button class="chip ${cat===i?"on":""}" data-i="${i}"><i style="background:${col}"></i>${n}</button>`).join("")}
function inf(i){const e=(E[i]||"").split("|"),L=["Estándares y terminologías","Datos clave","Se integra con","Qué debes dominar"];return `<div class="inf"><h3>🖥️ Perspectiva informática</h3><dl>${L.map((l,k)=>`<dt>${l}</dt><dd>${e[k]||""}</dd>`).join("")}</dl></div>`}
function show(i){cur=i;const d=D[i];
$("m").style.setProperty("--a",`var(--${C[d[1]][1]})`);
$("m").innerHTML=`<div class="tag">${C[d[1]][0]}</div><h2>${d[0]}</h2><p>${d[2]}</p><b>Funciones principales</b><ul>${d[3].split(";").map(f=>`<li>${f}</li>`).join("")}</ul>${inf(i)}<div class="nav"><button data-n="-1">← Anterior</button><button data-n="0">Cerrar</button><button data-n="1">Siguiente →</button></div>`;
$("ov").classList.add("show")}
function step(n){const ms=D.map((d,i)=>i).filter(i=>D[i][1]===D[cur][1]);show(ms[(ms.indexOf(cur)+n+ms.length)%ms.length])}
function setCat(c){cat=c;chips();dim()}
$("chips").onclick=e=>{const b=e.target.closest(".chip");if(b)setCat(+b.dataset.i)};
$("svg").onclick=e=>{const p=e.target.closest(".pill"),c=e.target.closest(".cat"),h=e.target.closest(".hub");
if(p)show(+p.dataset.i);else if(c)setCat(cat===+c.dataset.c?-1:+c.dataset.c);else if(h)setCat(-1)};
$("q").oninput=dim;
$("m").onclick=e=>{const b=e.target.closest("[data-n]");if(!b)return;const n=+b.dataset.n;n?step(n):$("ov").classList.remove("show")};
$("ov").onclick=e=>{if(e.target.id==="ov")$("ov").classList.remove("show")};
document.onkeydown=e=>{if(!$("ov").classList.contains("show"))return;if(e.key==="Escape")$("ov").classList.remove("show");if(e.key==="ArrowRight")step(1);if(e.key==="ArrowLeft")step(-1)};
chips();map();
</script></body></html>
