Inventario|Un recurso mal modelado genera conflictos de agenda y doble reserva.","Estructura organizacional; centros de costo|Establecimiento, servicio, centro de costo, catálogos|Todos los módulos; ERP|Es la parametrización base: un error aquí se propaga a todo el sistema.","Indicadores; ADT como fuente|Ocupación, estada, rotación, tiempos de espera|ADT, Camas, Reportes|Definir cada indicador (numerador, denominador, fuente) para que sea reproducible.","SAMU; GPS; FHIR Task/Location|Solicitud, móvil, ruta, tiempos|Emergencias, ADT|Integración con telemetría y registro de tiempos para indicadores prehospitalarios.","HL7 CDA; FHIR DocumentReference; PDF/A; Ley 19.799|Documento, versión, firmante, sello de tiempo|Clínico, Consentimientos, Auditoría|Firma electrónica avanzada y retención legal de la ficha; versionado inmutable.","SQL; modelo dimensional; ETL; REM/DEIS|Hechos, dimensiones, indicadores, vistas|Todos los módulos; data warehouse|La calidad del dato (completitud, consistencia) manda sobre el dashboard; mantener un diccionario de datos.","RBAC; LDAP/AD; SSO (OAuth2, OIDC, SAML); Ley 19.628 y 20.584|Usuario, rol, permiso, sesión|RRHH, todos los módulos|Mínimo privilegio; el acceso de emergencia (break-the-glass) debe quedar siempre auditado.","HL7 v2, FHIR R4, DICOM, IHE; motor de integración|Mensajes, mapeos, colas, errores|LIS, RIS/PACS, Farmacia, MINSAL, equipos|Monitoreo de colas y reproceso; mapeo de códigos entre sistemas; pruebas end to end en QA.","Clinical Decision Support; CDS Hooks; CQL|Regla, disparador, condición, acción|Clínico, Farmacia, Órdenes|Fatiga de alertas: reglas demasiado sensibles se ignoran; validar con clínicos y versionar.","NLP; modelos predictivos; FHIR|Datos de entrenamiento, scores, trazabilidad del modelo|Clínico, Reportes|Calidad y sesgo de los datos, privacidad y validación clínica antes de usarlo en la práctica.","IHE ATNA; FHIR AuditEvent; logs|Quién, qué, cuándo, desde dónde|IAM, todos los módulos|Registros inmutables; revisar accesos a fichas sensibles.","FHIR API; SMART on FHIR; OAuth2; Ley 20.584|Citas, resultados liberados, documentos|Agenda, Laboratorio, Clínico|Definir qué resultados se liberan y cuándo; autenticación fuerte (ClaveÚnica).","SSO; SMART on FHIR|Panel de tareas, alertas, pacientes asignados|Clínico, Agenda, IAM|Rendimiento y usabilidad: es la puerta de entrada diaria del clínico.","Pasarelas SMTP/SMS; push|Plantilla, canal, estado de envío|Agenda, Portal|Gestionar autorización de contacto y no enviar datos clínicos por canales inseguros.","FHIR Consent; firma electrónica; Ley 20.584|Tipo, versión, firma, vigencia, revocación|Clínico, Quirófano, Gestión Documental|Vincular al episodio o procedimiento; versionar los textos legales.","Acreditación de prestadores; indicadores; OMS|Evento adverso, severidad, análisis causa raíz|Clínico, Reportes, Auditoría|Flujos de notificación y seguimiento; el dato debe poder explotarse para análisis.","Seudonimización; CDISC; REDCap|Participante, protocolo, consentimiento, datos del estudio|Clínico, Reportes|Datos desidentificados y aprobación de comité de ética.","Roles y permisos acotados|Rotación, estudiante, supervisor|IAM, RRHH|Accesos temporales con supervisión y trazabilidad.","IAAS (MINSAL); CIE-10; microbiología (antibiograma, CLSI/EUCAST)|Aislamiento, germen, resistencia, caso IAAS|Laboratorio, Clínico, Camas|Reglas que generen alertas epidemiológicas a partir de resultados de laboratorio."];
let cat=-1,cur=-1;
const $=id=>document.getElementById(id),R=325,K=Math.PI/180,pt=(r,t)=>[500+r*Math.cos(t*K),500+r*Math.sin(t*K)];
const nodes=[],cn=[];
C.forEach((c,ci)=>{const ids=D.map((d,i)=>i).filter(i=>D[i][1]===ci),a=-90+ci*72,n=ids.length,sp=Math.min(60,n*4.2);
ids.forEach((i,k)=>nodes[i]=n>1?a-sp/2+sp*k/(n-1):a);cn[ci]={a,p:pt(170,a)}});
function map(){let s=`<defs><filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><radialGradient id="hg"><stop offset="0" stop-color="#1b4bff"/><stop offset="1" stop-color="#070c24"/></radialGradient></defs>`;
s+=`<circle class="ring" cx="500" cy="500" r="110"/><circle class="ring b" cx="500" cy="500" r="250"/><circle class="ring" cx="500" cy="500" r="${R}"/>`;
C.forEach((c,ci)=>{const [x,y]=cn[ci].p,col=`var(--${c[1]})`;
s+=`<line class="ln" data-c="${ci}" x1="500" y1="500" x2="${x}" y2="${y}" stroke="${col}" stroke-width="2"/>`;
D.forEach((d,i)=>{if(d[1]!==ci)return;const [nx,ny]=pt(R,nodes[i]);s+=`<line class="ln" data-i="${i}" x1="${x}" y1="${y}" x2="${nx}" y2="${ny}" stroke="${col}"/>`})});
D.forEach((d,i)=>{const t=nodes[i],f=Math.cos(t*K)<-0.001;
s+=`<g class="nd" data-i="${i}" style="--a:var(--${C[d[1]][1]})" transform="translate(500 500) rotate(${t})"><circle cx="${R}" r="6.5"/>${f?`<text transform="rotate(180)" x="${-(R+14)}" y="3.8" text-anchor="end">${d[0]}</text>`:`<text x="${R+14}" y="3.8">${d[0]}</text>`}</g>`});
C.forEach((c,ci)=>{const [x,y]=cn[ci].p,w=c[0].split(" "),h=Math.ceil(w.length/2);
s+=`<g class="ct" data-c="${ci}" style="--a:var(--${c[1]})" transform="translate(${x} ${y})"><circle r="38"/><text y="${-3}">${w.slice(0,h).join(" ")}</text><text y="10">${w.slice(h).join(" ")}</text></g>`});
s+=`<g class="hub"><circle cx="500" cy="500" r="64"/><text x="500" y="506" font-family="Orbitron,sans-serif" font-weight="800" font-size="28">HIS</text><text x="500" y="526" font-size="9" letter-spacing="2">${D.length} MÓDULOS</text></g>`;
$("svg").innerHTML=s;dim()}
function dim(){const t=$("q").value.toLowerCase();
document.querySelectorAll("[data-i]").forEach(e=>{const i=+e.dataset.i,d=D[i];e.classList.toggle("off",!((cat<0||d[1]===cat)&&(d[0]+d[2]+d[3]+(E[i]||"")).toLowerCase().includes(t)))});
document.querySelectorAll("[data-c]").forEach(e=>e.classList.toggle("off",cat>=0&&+e.dataset.c!==cat))}
function chips(){$("chips").innerHTML=[["Todos",-1,"#fff"],...C.map((c,i)=>[c[0],i,`var(--${c[1]})`])].map(([n,i,col])=>`<button class="chip ${cat===i?"on":""}" style="--k:${col}" data-i="${i}"><i></i>${n}</button>`).join("")}
function hud(i){const h=$("hud");if(i<0){h.style.removeProperty("--a");h.innerHTML=`<div class="tag">Panel holográfico</div><h2>Selecciona un nodo</h2><p>Cada nodo es un módulo del HIS. Verás qué hace, sus funciones y la perspectiva informática: estándares, datos clave, integraciones y qué debes dominar.</p><p class="tag">Tip: toca una categoría central para aislarla.</p>`;return}
const d=D[i],e=(E[i]||"").split("|"),L=["Estándares y terminologías","Datos clave","Se integra con","Qué debes dominar"];
h.style.setProperty("--a",`var(--${C[d[1]][1]})`);
h.innerHTML=`<div class="tag">${C[d[1]][0]}</div><h2>${d[0]}</h2><p>${d[2]}</p><div class="tag">Funciones principales</div><ul>${d[3].split(";").map(f=>`<li>${f}</li>`).join("")}</ul><div class="inf"><h3>PERSPECTIVA INFORMÁTICA</h3><dl>${L.map((l,k)=>`<dt>${l}</dt><dd>${e[k]||""}</dd>`).join("")}</dl></div><div class="nav"><button data-n="-1">← Anterior</button><button data-n="1">Siguiente →</button></div>`}
function pick(i){cur=i;document.querySelectorAll(".nd").forEach(e=>e.classList.toggle("sel",+e.dataset.i===i));hud(i);if(innerWidth<900)$("hud").scrollIntoView({behavior:"smooth",block:"nearest"})}
function step(n){if(cur<0)return;const ms=D.map((d,i)=>i).filter(i=>D[i][1]===D[cur][1]);pick(ms[(ms.indexOf(cur)+n+ms.length)%ms.length])}
function setCat(c){cat=c;chips();dim()}
$("chips").onclick=e=>{const b=e.target.closest(".chip");if(b)setCat(+b.dataset.i)};
$("svg").onclick=e=>{const p=e.target.closest(".nd"),c=e.target.closest(".ct");
if(p)pick(+p.dataset.i);else if(c)setCat(cat===+c.dataset.c?-1:+c.dataset.c);else if(e.target.closest(".hub")){setCat(-1);pick(-1)}};
$("hud").onclick=e=>{const b=e.target.closest("[data-n]");if(b)step(+b.dataset.n)};
$("q").oninput=dim;
document.onkeydown=e=>{if(e.target.id==="q")return;if(e.key==="ArrowRight")step(1);if(e.key==="ArrowLeft")step(-1)};
chips();map();hud(-1);
</script></body></html>
